<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Англи хэлний тест ба үгсийн сан</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn { width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background-color: #1557b0; }
        .btn-secondary { background-color: #5f6368; }
        .btn-secondary:hover { background-color: #444; }
        .btn-green { background-color: #188038; }
        .btn-green:hover { background-color: #0d652d; }
        
        .quiz-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; color: #555; }
        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #202124; line-height: 1.5; }
        .options label { display: block; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .options label:hover { background-color: #f8f9fa; }
        .options input[type="radio"] { margin-right: 10px; }
        .options input[type="radio"]:checked + span { font-weight: bold; color: #1a73e8; }
        .selected { border-color: #1a73e8 !important; background-color: #e8f0fe !important; }
        
        .result-box { text-align: center; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: #e8f0fe; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; border: 5px solid #1a73e8; }
        .score-circle span { font-size: 40px; font-weight: bold; color: #1a73e8; }
        .score-text { font-size: 20px; margin-bottom: 20px; }
        .review-list { text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 15px; }
        .review-item { background: #fff3f3; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #d93025; }
        .review-item p { margin: 5px 0; font-size: 14px; }
        .review-item .correct { color: #188038; font-weight: bold; }
        .review-item .wrong { color: #d93025; text-decoration: line-through; }
        
        .flashcard { background: #fff; border: 2px solid #1a73e8; border-radius: 15px; padding: 40px 20px; text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .flashcard:hover { background: #f8f9fa; }
        .flashcard .word { font-size: 28px; font-weight: bold; color: #1a73e8; margin-bottom: 10px; }
        .flashcard .translation { font-size: 22px; color: #188038; display: none; }
        .flashcard .hint { font-size: 14px; color: #888; margin-top: 10px; }
        
        .admin-panel { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        .admin-panel h3 { margin-bottom: 10px; color: #d93025; }
        .question-bank { max-height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .bank-item { background: #fff; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        .mode-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .mode-buttons .btn { flex: 1; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Нэвтрэх хэсэг -->
    <div id="loginScreen">
        <h1>Англи хэлний тест ба үгсийн сан</h1>
        <div class="input-group">
            <label>Сурагчийн нэр:</label>
            <input type="text" id="studentName" placeholder="Нэрээ оруулна уу...">
        </div>
        <div class="input-group">
            <label>Анги бүлэг (Сэдэв):</label>
            <select id="topicSelect">
                <option value="all">Бүх сэдэв</option>
                <option value="economy">8. Эдийн засаг, мөнгө</option>
                <option value="government">9. Засаглал, хууль, улс төр</option>
                <option value="travel">10. Аялал, газар зүй</option>
                <option value="emotions">11. Сэтгэл хөдлөл, зан төлөв</option>
                <option value="adjectives">12. Түгээмэл тэмдэг нэр</option>
                <option value="academic">13. Академик, эссений үйл үг</option>
                <option value="health">4. Эрүүл мэнд</option>
            </select>
        </div>
        <div class="input-group">
            <label>Горим сонгох:</label>
            <select id="modeSelect">
                <option value="test">Тест (Оноотой)</option>
                <option value="mn2en">Монголоос → Англи</option>
                <option value="en2mn">Англи → Монгол</option>
                <option value="flashcard">Үг цээжлэх карт</option>
            </select>
        </div>
        <button class="btn" onclick="startSession()">Эхлэх</button>
        <button class="btn btn-secondary" onclick="showAdminLogin()">Багшийн хэсэг</button>
    </div>

    <!-- Багшийн нууц үг -->
    <div id="adminLoginScreen" class="hidden">
        <h2>Багшийн хэсэг</h2>
        <div class="input-group">
            <label>Нууц үг:</label>
            <input type="password" id="adminPass" placeholder="Нууц үг...">
        </div>
        <button class="btn" onclick="checkAdmin()">Нэвтрэх</button>
        <button class="btn btn-secondary" onclick="showLogin()">Буцах</button>
    </div>

    <!-- Багшийн самбар -->
    <div id="adminPanelScreen" class="hidden">
        <h2>Багшийн самбар</h2>
        <div class="admin-panel">
            <h3>Үгийн сан</h3>
            <p>Нийт үг: <span id="totalWords">0</span></p>
            <div class="question-bank" id="wordBankList"></div>
        </div>
        <button class="btn btn-secondary" onclick="showLogin()">Гарах</button>
    </div>

    <!-- Тестийн хэсэг -->
    <div id="quizScreen" class="hidden">
        <div class="quiz-header">
            <span id="progressText">Асуулт 1/10</span>
            <span id="scoreText">Оноо: 0</span>
        </div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <button class="btn" id="nextBtn" onclick="nextQuestion()">Дараах</button>
    </div>

    <!-- Картын хэсэг -->
    <div id="flashcardScreen" class="hidden">
        <div class="quiz-header">
            <span id="cardProgressText">Карт 1/10</span>
        </div>
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="word" id="cardWord"></div>
            <div class="translation" id="cardTranslation"></div>
            <div class="hint">Дарж хариултыг харах</div>
        </div>
        <div class="mode-buttons">
            <button class="btn btn-green" onclick="nextCard()">Дараах карт</button>
            <button class="btn btn-secondary" onclick="location.reload()">Дуусгах</button>
        </div>
    </div>

    <!-- Дүнгийн хэсэг -->
    <div id="resultScreen" class="hidden">
        <div class="result-box">
            <h2>Дууслаа!</h2>
            <div class="score-circle">
                <span id="finalScore">0</span>
            </div>
            <div class="score-text" id="scoreMessage"></div>
            <div class="review-list" id="reviewList"></div>
            <button class="btn" onclick="location.reload()">Дахин эхлэх</button>
        </div>
    </div>
</div>
